@if (visible) {
  <div
    class="fixed inset-x-0 bottom-0 z-50 bg-black text-white border-t border-white/10 shadow-lg"
    role="dialog"
    aria-live="polite"
    aria-label="Aviso de cookies"
  >
    <div
      class="max-w-screen-xl mx-auto px-6 py-5 flex flex-col md:flex-row md:items-center gap-4 md:gap-8"
    >
      <p class="text-sm leading-relaxed flex-1">
        Usamos cookies propias esenciales para el funcionamiento del sitio. Puedes
        aceptarlas o rechazarlas; consulta más información en nuestra
        <a
          [routerLink]="['/politica-cookies']"
          class="underline hover:text-[#FFC145] transition-colors"
          >Política de Cookies</a
        >.
      </p>
      <div class="flex gap-3 shrink-0">
        <button
          type="button"
          (click)="reject()"
          class="flex-1 md:flex-none px-5 py-2.5 border border-white/40 text-white text-sm hover:bg-white/10 transition-colors"
        >
          Rechazar
        </button>
        <button
          type="button"
          (click)="accept()"
          class="flex-1 md:flex-none px-5 py-2.5 bg-[#FFC145] text-gray-900 font-semibold text-sm hover:bg-[#e6ac3d] transition-colors"
        >
          Aceptar
        </button>
      </div>
    </div>
  </div>
}
